# ═══════════════════════════════════════════════════════
# 站点基础信息 —— 换博客时改这几行就够
# ═══════════════════════════════════════════════════════
baseURL: "https://lzl114105.github.io/"   # 仓库叫别的名字时,这里要写成 https://lzl114105.github.io/仓库名/
title: "半山"
theme: "hugo-theme-stack"

# 中文站点必须开 hasCJKLanguage,否则 .Summary 会把汉字当英文按空格断句
locale: "zh-cn"
defaultContentLanguage: "zh"
hasCJKLanguage: true
timeZone: "Asia/Shanghai"

# 首页每页显示几篇
pagination:
  pagerSize: 8

# 文章和独立页面的地址格式:/p/文章名/、/关于/
permalinks:
  post: "/p/:slug/"
  page: "/:slug/"

# ═══════════════════════════════════════════════════════
# 主题外观
# ═══════════════════════════════════════════════════════
params:
  mainSections: ["post"]
  rssFullContent: true

  # ═══════════════════════════════════════════════════════
  # 开场 —— 黑幕上浮出一个词，一道斜光把它切开，幕布随即撕向两侧
  # 只在首页播、每个会话播一次（刷新不重播，关掉标签页再开才播）
  # 不喜欢就把 enable 改成 false，页面行为完全回到没有它的样子
  # ═══════════════════════════════════════════════════════
  intro:
    enable: true
    text: "半山"        # 幕布中央那个词，1-3 个字最有劲
    tagline: ""         # 词下面一行小字（约 14px，字距很开），留空就不显示

  # ═══════════════════════════════════════════════════════
  # 图片总入口 —— 换图只改这一段，不用碰模板
  # 路径都相对 assets/ 目录；Hugo 构建时自动转 WebP、按需切尺寸
  # 留空 "" 就退回内置渐变占位，页面不会出现破图
  # ═══════════════════════════════════════════════════════
  images:
    # ① 首页门头横幅：建议 1600×640 以上的横图（风景、插画都行）
    hero: "img/hero.png"

    # ② 分类卡片封面：键名必须和分类名一模一样
    #    没有的分类会自动用渐变色块，加了图就自动换成图
    categories:
      技术: "img/cat-tech.png"
      随笔: "img/cat-life.png"
      备忘: "img/cat-note.png"

    # ③ 文章没在 front matter 里写 image 时的兜底封面（留空则不出图）
    postFallback: ""

  # ④ 头像与站点图标（主题从这两个键读，所以单独放）
  sidebar:
    emoji: "✍️"
    subtitle: "写下想到的,留住想留的"
    avatar: "img/avatar.png"
  favicon: "img/avatar.png"

  footer:
    since: 2026
    customText: ""

  article:
    headingAnchor: false
    math: false          # 要写数学公式的改成 true
    toc: true            # 文章右侧目录
    readingTime: true    # 显示阅读时长
    license:
      enabled: true
      default: "本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 协议,转载请注明出处。"
    list:
      showTags: true

  # 首页右栏卡片
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  colorScheme:
    toggle: true
    default: "auto"      # auto 跟随系统

  # 评论:先关着。要用时把 enabled 改 true,填 giscus 的 repo 和 repoID
  comments:
    enabled: false
    provider: giscus
    giscus:
      repo: ""
      repoID: ""
      category: "Announcements"
      categoryID: ""
      mapping: "pathname"
      lang: "zh-CN"

# ═══════════════════════════════════════════════════════
# Markdown 渲染
# ═══════════════════════════════════════════════════════
markup:
  goldmark:
    renderer:
      unsafe: true       # 允许在 md 里直接写 HTML
    extensions:
      passthrough:       # 数学公式透传,配合 params.article.math 使用
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
    tabWidth: 4

# ═══════════════════════════════════════════════════════
# 侧边栏社交图标
# ═══════════════════════════════════════════════════════
menu:
  social:
    - identifier: github
      name: GitHub
      url: "https://github.com/lzl114105"
      params:
        icon: brand-github
        newTab: true

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200
